<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Currency Converter</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <header class="pane-header">
        <img width="32" height="32" src="../../assets/icon-32.png" alt="" />
        <div>
            <h1>Currency Converter</h1>
            <p class="subtitle">Rates from the European Central Bank via Frankfurter</p>
        </div>
    </header>

    <!-- Shown when the page is opened outside Excel -->
    <section id="sideload-msg" class="notice">
        Open this add-in from Excel to use it. See the README for how to sideload it.
    </section>

    <main id="app-body" hidden>
        <form id="convert-form" novalidate>
            <div class="field">
                <label for="amount">Amount</label>
                <input class="control" id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off"
                    placeholder="e.g. 100" value="100" />
            </div>

            <div class="currency-row">
                <div class="field">
                    <label for="from">From</label>
                    <select class="control" id="from" name="from"></select>
                </div>
                <button type="button" id="swap" class="icon-button" title="Swap currencies"
                    aria-label="Swap currencies">⇄</button>
                <div class="field">
                    <label for="to">To</label>
                    <select class="control" id="to" name="to"></select>
                </div>
            </div>

            <div class="field">
                <label for="date">Date of rate</label>
                <input class="control" id="date" name="date" type="date" />
                <span class="hint">Leave empty for the latest rate. Weekends use the previous working day.</span>
            </div>

            <label class="checkbox">
                <input id="show-history" type="checkbox" checked />
                Add a chart of the last 30 days
            </label>

            <button type="submit" id="convert" class="primary">Convert</button>
        </form>

        <div id="status" class="status" role="status" aria-live="polite" hidden></div>

        <section id="result" class="result" hidden>
            <p class="result-main" id="result-main"></p>
            <p class="result-detail" id="result-detail"></p>
        </section>
    </main>
</body>

</html>
